name: Mobile layout
on:
  pull_request:
    branches: [main]
    paths: ['app/**', 'components/**', 'lib/**', 'scripts/**', 'package*.json', '.github/workflows/mobile-layout.yml']
  push:
    branches: [main]
    paths: ['app/**', 'components/**', 'lib/**', 'scripts/**', 'package*.json', '.github/workflows/mobile-layout.yml']
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run build && npm run audit:export
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layout-report
          path: mobile-audit/
          retention-days: 14
