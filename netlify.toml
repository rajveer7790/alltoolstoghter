[build]
  command = "npm run check && npm run build && npm run audit:export"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Static export: never rewrite unknown URLs to a 200 homepage (soft 404).

# Notify only after a successful production deploy; previews never submit.
[[plugins]]
  package = "./netlify/plugins/indexnow"
